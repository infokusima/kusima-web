name: Deploy KUSIMA web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nacitaj cerstve spravy Mesta Svit z RSS
        shell: python
        run: |
          import json, os, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://www.svit.sk/index.php?rss=200"
          os.makedirs("data", exist_ok=True)
          out = {"source": url, "updated_at": datetime.now(timezone.utc).isoformat(), "items": []}
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "KUSIMA-web/1.0"})
              raw = urllib.request.urlopen(req, timeout=25).read()
              root = ET.fromstring(raw)
              all_items=[]
              for item in root.findall(".//item")[:30]:
                  def txt(name):
                      el=item.find(name)
                      return (el.text or "").strip() if el is not None else ""
                  all_items.append({"title":txt("title"),"link":txt("link"),"pubDate":txt("pubDate"),"description":txt("description")})
              news=[x for x in all_items if "/mesto/aktuality/" in x.get("link","") and "file_storage" not in x.get("link","")]
              out["items"]=(news or all_items)[:6]
              out["status"]="ok"
          except Exception as exc:
              out["status"]="error"
              out["error"]=str(exc)

          with open("data/svit-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Nacitaj aktualne oznamy Mesta Vysoke Tatry z oficialnej stranky
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          url = "https://www.vysoketatry.sk/mid/413600/ma0/all/module_page/413600/0/.html"
          os.makedirs("data", exist_ok=True)
          out = {"source": url, "updated_at": datetime.now(timezone.utc).isoformat(), "items": []}

          class NoticeParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_heading=False
                  self.heading_tag=None
                  self.text=[]
                  self.href=""
                  self.started=False
                  self.items=[]

              def handle_starttag(self, tag, attrs):
                  if tag in ("h1","h2","h3","h4"):
                      self.in_heading=True
                      self.heading_tag=tag
                      self.text=[]
                      self.href=""
                  elif self.in_heading and tag == "a":
                      self.href=dict(attrs).get("href","")

              def handle_data(self, data):
                  if self.in_heading:
                      self.text.append(data)

              def handle_endtag(self, tag):
                  if self.in_heading and tag == self.heading_tag:
                      title=" ".join(" ".join(self.text).split()).strip()
                      low=title.lower()
                      if "aktuálne oznamy mesta vysoké tatry" in low:
                          self.started=True
                      elif self.started:
                          stop_titles=("vyhľadávač oznamov","rýchle odkazy","poloha mestského úradu","za obsah zodpovedá","technický prevádzkovateľ","informácie o stránke")
                          if any(x in low for x in stop_titles):
                              if self.items:
                                  self.started=False
                          elif len(title) >= 5 and len(self.items) < 8:
                              link=urljoin(url,self.href) if self.href else url
                              if not any(x["title"] == title for x in self.items):
                                  self.items.append({"title":title,"link":link,"pubDate":"","description":""})
                      self.in_heading=False
                      self.heading_tag=None
                      self.text=[]
                      self.href=""

          try:
              req=urllib.request.Request(url,headers={"User-Agent":"KUSIMA-web/1.0"})
              html=urllib.request.urlopen(req,timeout=25).read().decode("utf-8","replace")
              parser=NoticeParser()
              parser.feed(html)
              out["items"]=parser.items[:6]
              if out["items"]:
                  out["status"]="ok"
              else:
                  out["status"]="error"
                  out["error"]="Na oficialnej stranke sa nepodarilo najst aktualne oznamy."
          except Exception as exc:
              out["status"]="error"
              out["error"]=str(exc)

          with open("data/tatry-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Priprav dnesne slovenske meniny
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          os.makedirs("data", exist_ok=True)
          now=datetime.now(ZoneInfo("Europe/Bratislava"))
          source="https://raw.githubusercontent.com/zoltancsontos/slovak-name-days-json/master/slovak-nameday-list-shorter.json"
          out={"date":now.strftime("%Y-%m-%d"),"name":""}
          try:
              req=urllib.request.Request(source,headers={"User-Agent":"KUSIMA-web/1.0"})
              data=json.loads(urllib.request.urlopen(req,timeout=20).read().decode("utf-8"))
              out["name"]=data[str(now.month-1)][str(now.day)]
              out["source"]=source
          except Exception as exc:
              out["error"]=str(exc)
          with open("data/nameday.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Zapoj dynamicke bloky a jednotny layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="home-panels.js?v=20260906-2"></script>',
              '<script src="rss-svit.js?v=1"></script>',
              '<script src="rss-tatry.js?v=2"></script>',
              '<script src="topbar-contact.js"></script>',
              '<script src="layout-master.js?v=2"></script>',
              '<script src="client-columns.js?v=1"></script>',
              '<script src="chime.js?v=2"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
