name: Deploy KUSIMA web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nacitaj cerstve spravy Mesta Svit z RSS
        shell: python
        run: |
          import json, os, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://www.svit.sk/index.php?rss=200"
          os.makedirs("data", exist_ok=True)
          out = {"source": url, "updated_at": datetime.now(timezone.utc).isoformat(), "items": []}
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "KUSIMA-web/1.0"})
              raw = urllib.request.urlopen(req, timeout=25).read()
              root = ET.fromstring(raw)
              all_items=[]
              for item in root.findall(".//item")[:30]:
                  def txt(name):
                      el=item.find(name)
                      return (el.text or "").strip() if el is not None else ""
                  all_items.append({"title":txt("title"),"link":txt("link"),"pubDate":txt("pubDate"),"description":txt("description")})
              news=[x for x in all_items if "/mesto/aktuality/" in x.get("link","") and "file_storage" not in x.get("link","")]
              out["items"]=(news or all_items)[:6]
              out["status"]="ok"
          except Exception as exc:
              out["status"]="error"
              out["error"]=str(exc)

          with open("data/svit-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Nacitaj spravy z regionu Vysoke Tatry z Google News RSS
        shell: python
        run: |
          import json, os, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from urllib.parse import quote_plus

          query="Vysoké Tatry"
          url=f"https://news.google.com/rss/search?q={quote_plus(query)}&hl=sk&gl=SK&ceid=SK:sk"
          os.makedirs("data", exist_ok=True)
          out={"source":url,"updated_at":datetime.now(timezone.utc).isoformat(),"items":[]}

          try:
              req=urllib.request.Request(url,headers={
                  "User-Agent":"Mozilla/5.0 KUSIMA-web/1.0",
                  "Accept":"application/rss+xml,application/xml,text/xml,*/*"
              })
              raw=urllib.request.urlopen(req,timeout=25).read()
              root=ET.fromstring(raw)
              items=[]
              for item in root.findall(".//item")[:30]:
                  def txt(name):
                      el=item.find(name)
                      return (el.text or "").strip() if el is not None else ""
                  title=txt("title")
                  if title and ("tat" in title.lower() or "smokovec" in title.lower() or "lomnica" in title.lower()):
                      items.append({
                          "title":title,
                          "link":txt("link"),
                          "pubDate":txt("pubDate"),
                          "description":txt("description")
                      })
              out["items"]=(items or [{
                  "title":(item.findtext("title") or "").strip(),
                  "link":(item.findtext("link") or "").strip(),
                  "pubDate":(item.findtext("pubDate") or "").strip(),
                  "description":(item.findtext("description") or "").strip()
              } for item in root.findall(".//item")[:6] if (item.findtext("title") or "").strip()])[:6]
              out["status"]="ok" if out["items"] else "error"
              if not out["items"]:
                  out["error"]="Google News RSS nevratil spravy."
          except Exception as exc:
              out["status"]="error"
              out["error"]=str(exc)

          with open("data/tatry-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Priprav dnesne slovenske meniny
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          os.makedirs("data", exist_ok=True)
          now=datetime.now(ZoneInfo("Europe/Bratislava"))
          source="https://raw.githubusercontent.com/zoltancsontos/slovak-name-days-json/master/slovak-nameday-list-shorter.json"
          out={"date":now.strftime("%Y-%m-%d"),"name":""}
          try:
              req=urllib.request.Request(source,headers={"User-Agent":"KUSIMA-web/1.0"})
              data=json.loads(urllib.request.urlopen(req,timeout=20).read().decode("utf-8"))
              out["name"]=data[str(now.month-1)][str(now.day)]
              out["source"]=source
          except Exception as exc:
              out["error"]=str(exc)
          with open("data/nameday.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Nacitaj aktualne pocasie pre Svit
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime, timezone

          lat=49.05824
          lon=20.19653
          url=(
              "https://api.open-meteo.com/v1/forecast"
              f"?latitude={lat}&longitude={lon}"
              "&current=temperature_2m,weather_code,is_day"
              "&timezone=Europe%2FBratislava"
          )
          os.makedirs("data", exist_ok=True)
          out={"source":url,"updated_at":datetime.now(timezone.utc).isoformat(),"status":"error"}
          descriptions={
              0:"Jasno",1:"Prevažne jasno",2:"Polooblačno",3:"Zamračené",
              45:"Hmla",48:"Mrznúca hmla",51:"Slabé mrholenie",53:"Mrholenie",55:"Silné mrholenie",
              56:"Mrznúce mrholenie",57:"Silné mrznúce mrholenie",61:"Slabý dážď",63:"Dážď",65:"Silný dážď",
              66:"Mrznúci dážď",67:"Silný mrznúci dážď",71:"Slabé sneženie",73:"Sneženie",75:"Silné sneženie",
              77:"Snehové zrná",80:"Slabé prehánky",81:"Prehánky",82:"Silné prehánky",85:"Slabé snehové prehánky",
              86:"Silné snehové prehánky",95:"Búrka",96:"Búrka s krúpami",99:"Silná búrka s krúpami"
          }
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"KUSIMA-web/1.0"})
              data=json.loads(urllib.request.urlopen(req,timeout=20).read().decode("utf-8"))
              cur=data.get("current",{})
              code=int(cur.get("weather_code",-1))
              out.update({
                  "status":"ok",
                  "temperature":float(cur["temperature_2m"]),
                  "weather_code":code,
                  "is_day":int(cur.get("is_day",1)),
                  "description":descriptions.get(code,"Aktuálne počasie"),
                  "time":cur.get("time","")
              })
          except Exception as exc:
              out["error"]=str(exc)
          with open("data/weather-svit.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Zapoj dynamicke bloky a jednotny layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="home-panels.js?v=20260907-4"></script>',
              '<script src="weather-home.js?v=4"></script>',
              '<script src="rss-svit.js?v=1"></script>',
              '<script src="rss-tatry.js?v=4"></script>',
              '<script src="topbar-contact.js"></script>',
              '<script src="layout-master.js?v=3"></script>',
              '<script src="client-columns.js?v=1"></script>',
              '<script src="content-v2.js?v=1"></script>',
              '<script src="articles-wave2.js?v=1"></script>',
              '<script src="articles-wave3.js?v=2"></script>',
              '<script src="public-cleanup.js?v=3"></script>',
              '<script src="chime.js?v=3"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
