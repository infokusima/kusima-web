name: Deploy KUSIMA web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nacitaj cerstve spravy Mesta Svit z RSS
        shell: python
        run: |
          import json, os, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://www.svit.sk/index.php?rss=200"
          os.makedirs("data", exist_ok=True)
          out = {"source": url, "updated_at": datetime.now(timezone.utc).isoformat(), "items": []}
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "KUSIMA-web/1.0"})
              raw = urllib.request.urlopen(req, timeout=25).read()
              root = ET.fromstring(raw)
              all_items=[]
              for item in root.findall(".//item")[:30]:
                  def txt(name):
                      el=item.find(name)
                      return (el.text or "").strip() if el is not None else ""
                  all_items.append({"title":txt("title"),"link":txt("link"),"pubDate":txt("pubDate"),"description":txt("description")})
              news=[x for x in all_items if "/mesto/aktuality/" in x.get("link","") and "file_storage" not in x.get("link","")]
              out["items"]=(news or all_items)[:6]
              out["status"]="ok"
          except Exception as exc:
              out["status"]="error"
              out["error"]=str(exc)

          with open("data/svit-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Nacitaj aktualne oznamy Mesta Vysoke Tatry z oficialneho RSS
        shell: python
        run: |
          import html, json, os, re, urllib.request
          from datetime import datetime, timezone

          url = "https://www.vysoketatry.sk/get_rss.php?id=1_atom_3908"
          fallback = "https://www.vysoketatry.sk/mid/413600/ma0/all/.html"
          os.makedirs("data", exist_ok=True)
          out = {"source": url, "updated_at": datetime.now(timezone.utc).isoformat(), "items": []}

          def clean(value):
              if not value:
                  return ""
              value=re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', value, flags=re.S)
              value=re.sub(r'<[^>]+>', ' ', value)
              return ' '.join(html.unescape(value).split()).strip()

          def first(pattern, text):
              m=re.search(pattern,text,re.I|re.S)
              return m.group(1).strip() if m else ""

          try:
              req=urllib.request.Request(url,headers={
                  "User-Agent":"Mozilla/5.0 KUSIMA-web/1.0",
                  "Accept":"application/atom+xml,application/rss+xml,application/xml,text/xml,*/*"
              })
              raw=urllib.request.urlopen(req,timeout=25).read().decode("utf-8","replace")

              # Feed mesta obcas obsahuje znak, ktory prisny XML parser odmietne.
              # Preto citame jednotlive entry/item bloky tolerantne ako text.
              blocks=re.findall(r'<entry\b[^>]*>.*?</entry>',raw,re.I|re.S)
              if not blocks:
                  blocks=re.findall(r'<item\b[^>]*>.*?</item>',raw,re.I|re.S)

              items=[]
              for block in blocks[:20]:
                  title=clean(first(r'<title\b[^>]*>(.*?)</title>',block))
                  link=first(r'<link\b[^>]*href=["\']([^"\']+)',block)
                  if not link:
                      link=clean(first(r'<link\b[^>]*>(.*?)</link>',block))
                  link=html.unescape(link).strip()
                  date=clean(first(r'<(?:updated|published|pubDate)\b[^>]*>(.*?)</(?:updated|published|pubDate)>',block))
                  desc=clean(first(r'<(?:summary|description|content)\b[^>]*>(.*?)</(?:summary|description|content)>',block))
                  if title:
                      items.append({"title":title,"link":link or fallback,"pubDate":date,"description":desc})

              out["items"]=items[:6]
              if out["items"]:
                  out["status"]="ok"
              else:
                  out["status"]="error"
                  out["error"]="Oficialny RSS neobsahoval citatelne polozky."
          except Exception as exc:
              out["status"]="error"
              out["error"]=str(exc)

          with open("data/tatry-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Priprav dnesne slovenske meniny
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          os.makedirs("data", exist_ok=True)
          now=datetime.now(ZoneInfo("Europe/Bratislava"))
          source="https://raw.githubusercontent.com/zoltancsontos/slovak-name-days-json/master/slovak-nameday-list-shorter.json"
          out={"date":now.strftime("%Y-%m-%d"),"name":""}
          try:
              req=urllib.request.Request(source,headers={"User-Agent":"KUSIMA-web/1.0"})
              data=json.loads(urllib.request.urlopen(req,timeout=20).read().decode("utf-8"))
              out["name"]=data[str(now.month-1)][str(now.day)]
              out["source"]=source
          except Exception as exc:
              out["error"]=str(exc)
          with open("data/nameday.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Zapoj dynamicke bloky a jednotny layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="home-panels.js?v=20260907-3"></script>',
              '<script src="rss-svit.js?v=1"></script>',
              '<script src="rss-tatry.js?v=3"></script>',
              '<script src="topbar-contact.js"></script>',
              '<script src="layout-master.js?v=2"></script>',
              '<script src="client-columns.js?v=1"></script>',
              '<script src="chime.js?v=3"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
