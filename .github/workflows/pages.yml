name: Deploy KUSIMA web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nacitaj cerstve spravy Mesta Svit z RSS
        shell: python
        run: |
          import json, os, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://www.svit.sk/index.php?rss=200"
          os.makedirs("data", exist_ok=True)
          out = {"source": url, "updated_at": datetime.now(timezone.utc).isoformat(), "items": []}
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "KUSIMA-web/1.0"})
              raw = urllib.request.urlopen(req, timeout=25).read()
              root = ET.fromstring(raw)
              all_items=[]
              for item in root.findall(".//item")[:30]:
                  def txt(name):
                      el=item.find(name)
                      return (el.text or "").strip() if el is not None else ""
                  all_items.append({"title":txt("title"),"link":txt("link"),"pubDate":txt("pubDate"),"description":txt("description")})
              news=[x for x in all_items if "/mesto/aktuality/" in x.get("link","") and "file_storage" not in x.get("link","")]
              out["items"]=(news or all_items)[:6]
              out["status"]="ok"
          except Exception as exc:
              out["status"]="error"
              out["error"]=str(exc)

          with open("data/svit-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Nacitaj novinky z regionu Vysoke Tatry
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          sources=["https://visittatry.sk/","https://visittatry.sk/en/news"]
          os.makedirs("data", exist_ok=True)
          out={"source":sources[0],"updated_at":datetime.now(timezone.utc).isoformat(),"items":[]}

          class ArticleParser(HTMLParser):
              def __init__(self,base):
                  super().__init__(convert_charrefs=True)
                  self.base=base
                  self.in_a=False
                  self.href=""
                  self.text=[]
                  self.items=[]

              def handle_starttag(self,tag,attrs):
                  if tag=="a" and not self.in_a:
                      self.in_a=True
                      self.href=dict(attrs).get("href","") or ""
                      self.text=[]

              def handle_data(self,data):
                  if self.in_a:
                      self.text.append(data)

              def handle_endtag(self,tag):
                  if tag=="a" and self.in_a:
                      href=self.href
                      title=" ".join(" ".join(self.text).split()).strip()
                      if "/clanky/" in href and len(title)>=12:
                          bad=("všetky novinky","all news","viac","more")
                          if title.lower() not in bad:
                              if len(title)>170:
                                  title=title[:167].rstrip()+"…"
                              link=urljoin(self.base,href)
                              if not any(x["link"]==link for x in self.items):
                                  self.items.append({"title":title,"link":link,"pubDate":"","description":""})
                      self.in_a=False
                      self.href=""
                      self.text=[]

          errors=[]
          for url in sources:
              try:
                  req=urllib.request.Request(url,headers={
                      "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 KUSIMA-web/1.0",
                      "Accept":"text/html,application/xhtml+xml"
                  })
                  text=urllib.request.urlopen(req,timeout=25).read().decode("utf-8","replace")
                  parser=ArticleParser(url)
                  parser.feed(text)
                  if parser.items:
                      out["source"]=url
                      out["items"]=parser.items[:6]
                      out["status"]="ok"
                      break
              except Exception as exc:
                  errors.append(str(exc))

          if not out["items"]:
              out["status"]="error"
              out["error"]="; ".join(errors) if errors else "VisitTatry nevratil citatelne novinky."

          with open("data/tatry-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Priprav dnesne slovenske meniny
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          os.makedirs("data", exist_ok=True)
          now=datetime.now(ZoneInfo("Europe/Bratislava"))
          source="https://raw.githubusercontent.com/zoltancsontos/slovak-name-days-json/master/slovak-nameday-list-shorter.json"
          out={"date":now.strftime("%Y-%m-%d"),"name":""}
          try:
              req=urllib.request.Request(source,headers={"User-Agent":"KUSIMA-web/1.0"})
              data=json.loads(urllib.request.urlopen(req,timeout=20).read().decode("utf-8"))
              out["name"]=data[str(now.month-1)][str(now.day)]
              out["source"]=source
          except Exception as exc:
              out["error"]=str(exc)
          with open("data/nameday.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)

      - name: Zapoj dynamicke bloky a jednotny layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="home-panels.js?v=20260907-4"></script>',
              '<script src="rss-svit.js?v=1"></script>',
              '<script src="rss-tatry.js?v=4"></script>',
              '<script src="topbar-contact.js"></script>',
              '<script src="layout-master.js?v=2"></script>',
              '<script src="client-columns.js?v=1"></script>',
              '<script src="chime.js?v=3"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
